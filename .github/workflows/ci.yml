---
name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  example:
    environment: integration
    strategy:
      matrix:
        os:
          - ubuntu-latest
        storage:
          - s3://nisshi/
          - postgres://postgres:postgres@db
        nisshi:
          - ghcr.io/nisshi-io/solace-nisshi:edge
          - ghcr.io/nisshi-io/solace-nisshi:latest
    runs-on: ${{matrix.os}}
    env:
      ADVERTISED_LISTENER_URL: tcp://127.0.0.1:9092
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_ALLOW_HTTP: true
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT: http://minio:9000
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CLUSTER_ID: kafka-python-integration
      RUST_BACKTRACE: 1
      RUST_LOG: warn,nisshi_broker=debug,nisshi_storage=debug
      STORAGE_ENGINE: ${{matrix.storage}}
      NISSHI_IMAGE: ${{matrix.nisshi}}
    steps:
      - uses: actions/checkout@v7
      # Nisshi checks at startup that its S3 bucket exists, so create the bucket first.
      - run: docker compose --progress plain up --no-color --quiet-pull --detach --wait minio
      - run: docker compose exec minio /usr/bin/mc ready local
      - run: docker compose exec minio /usr/bin/mc alias set local http://localhost:9000 ${{ secrets.AWS_ACCESS_KEY_ID }} ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - run: docker compose exec minio /usr/bin/mc mb local/nisshi
      - run: docker compose --progress plain up --no-color --quiet-pull --detach --wait
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run example.py
